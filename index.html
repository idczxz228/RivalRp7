function render(){
 const u=UI[L];document.documentElement.lang=L;applyTR();
 $("#h1").textContent=u.h1;$("#ldsub").textContent=u.h1;themeUI();if(R)rules();$("#sub").textContent=u.sub;$("#q").placeholder=u.ph;$("#ft").textContent=u.ft;
 $("#lcur").textContent=LANGS[L][0]+" "+LANGS[L][1]+" ▾";
 $("#lmenu").innerHTML=Object.entries(LANGS).map(([k,v])=>`<button data-l="${k}" class="${k===L?"on":""}">${v[0]} ${v[1]}</button>`).join("");
 const all={ru:"Все",uk:"Усі",kk:"Барлығы"}[L];
 $("#tabs").innerHTML=[{id:"all",t:{ru:all}},...DATA.filter(s=>s.id!=="dc"&&s.id!=="tg")].map(s=>`<button class="tab ${s.id===cur?"on":""}" data-id="${s.id}">${s.t[L]||s.t.ru}</button>`).join("");
 const q=Q.trim().toLowerCase();let h="";
 DATA.filter(s=>s.id!=="dc"&&s.id!=="tg"&&(cur==="all"||s.id===cur)).forEach(s=>s.items.forEach(i=>{
  if(i.h){if(!q)h+=`<h3 class="chap">${typeof i.h==="object"?(i.h[L]||i.h.ru):i.h}</h3>`;return}

function rules(){const s=DATA.find(x=>x.id===R);if(!s)return;$("#mt").textContent=s.t[L]||s.t.ru;$("#mb").innerHTML=s.items.map((i,k)=>`<div class="mi" style="animation-delay:${k*70}ms"><b>${i.n}. ${i.t[L]||i.t.ru}</b><p>${dd(i)}</p></div>`).join("")}

const t0=performance.now();addEventListener("load",()=>setTimeout(()=>$("#loader").classList.add("hide"),Math.max(0,900-(performance.now()-t0))));

<script>
(function(){
var rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
/* 3D coin */
var c=document.getElementById("coinin"),box=document.getElementById("coin");
if(c&&box){for(var i=-4;i<=4;i++){var d=document.createElement("div");d.className="cl";d.style.transform="translateZ("+i*2+"px)";c.appendChild(d)}
var fr=document.createElement("div");fr.className="cf f";var bk=document.createElement("div");bk.className="cf b";c.appendChild(fr);c.appendChild(bk);
var a=25,v=.6,drag=false,lx=0;
box.addEventListener("pointerdown",function(e){drag=true;lx=e.clientX;try{box.setPointerCapture(e.pointerId)}catch(x){}box.style.cursor="grabbing"});
box.addEventListener("pointermove",function(e){if(!drag)return;var dx=e.clientX-lx;lx=e.clientX;a+=dx*.8;v=dx*.8});
var up=function(){drag=false;box.style.cursor="grab"};box.addEventListener("pointerup",up);box.addEventListener("pointercancel",up);
(function tick(){if(!drag){v+=(.6-v)*.02;a+=v}c.style.transform="rotateX(-10deg) rotateY("+a+"deg)";if(!rm)requestAnimationFrame(tick)})();}
/* 3D particle field */
var cv=document.createElement("canvas");cv.id="fx";document.body.prepend(cv);var x=cv.getContext("2d"),W=0,H=0,P=[],N=innerWidth<700?50:100,mx=0,my=0,col="139,123,255",fc=0;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener("resize",rs);
for(var k=0;k<N;k++)P.push({x:Math.random()*2-1,y:Math.random()*2-1,z:Math.random()});
addEventListener("pointermove",function(e){mx=e.clientX/W-.5;my=e.clientY/H-.5});
function hex(){var s=getComputedStyle(document.documentElement).getPropertyValue("--acc").trim(),m=/^#([0-9a-f]{6})$/i.exec(s);if(m){var n=parseInt(m[1],16);col=(n>>16)+","+((n>>8)&255)+","+(n&255)}else{var r=/(\d+)[ ,]+(\d+)[ ,]+(\d+)/.exec(s);if(r)col=r[1]+","+r[2]+","+r[3]}}
function frame(){if(!(fc++%90))hex();x.clearRect(0,0,W,H);var pts=[];
for(var i=0;i<N;i++){var p=P[i];p.z-=.0013;if(p.z<.03){p.z=1;p.x=Math.random()*2-1;p.y=Math.random()*2-1}
var sc=.55/p.z,sx=W/2+(p.x+mx*.35)*sc*W*.5,sy=H/2+(p.y+my*.35)*sc*H*.5;
if(sx<-20||sx>W+20||sy<-20||sy>H+20)continue;var al=Math.min(1,(1-p.z)*1.4),r=Math.min(3,.5+(1-p.z)*2.6);
x.fillStyle="rgba("+col+","+al.toFixed(2)+")";x.beginPath();x.arc(sx,sy,r,0,6.283);x.fill();pts.push(sx,sy,al)}
if(W>700){x.lineWidth=.6;for(var i=0;i<pts.length;i+=3)for(var j=i+3;j<pts.length;j+=3){var dx=pts[i]-pts[j],dy=pts[i+1]-pts[j+1],d=dx*dx+dy*dy;if(d<9000){x.strokeStyle="rgba("+col+","+((1-d/9000)*.22*Math.min(pts[i+2],pts[j+2])).toFixed(3)+")";x.beginPath();x.moveTo(pts[i],pts[i+1]);x.lineTo(pts[j],pts[j+1]);x.stroke()}}}
if(!rm)requestAnimationFrame(frame)}
frame();
/* scroll progress */
var pr=document.getElementById("prog"),tk=0;
function sp(){tk=0;var h=document.documentElement,m=h.scrollHeight-h.clientHeight;pr.style.transform="scaleX("+(m>0?Math.min(1,h.scrollTop/m):0)+")"}
addEventListener("scroll",function(){if(!tk)tk=requestAnimationFrame(sp)},{passive:true});sp();
/* 3D tilt (mouse only) */
if(matchMedia("(hover:hover) and (pointer:fine)").matches){var cur=null,raf=0,ev;
function rz(el){if(el){el.style.setProperty("--rx","0deg");el.style.setProperty("--ry","0deg")}}
document.addEventListener("pointermove",function(e){if(e.pointerType!=="mouse")return;ev=e;if(raf)return;raf=requestAnimationFrame(function(){raf=0;var t=ev.target,el=t&&t.closest?t.closest(".item,.hero,.map"):null;if(el!==cur){rz(cur);cur=el}if(!el)return;
var r=el.getBoundingClientRect(),px=(ev.clientX-r.left)/r.width,py=(ev.clientY-r.top)/r.height,m=el.classList.contains("item")?4:6;
el.style.setProperty("--ry",((px-.5)*m*2).toFixed(2)+"deg");el.style.setProperty("--rx",((.5-py)*m*2).toFixed(2)+"deg");el.style.setProperty("--mx",(px*100).toFixed(1)+"%");el.style.setProperty("--my",(py*100).toFixed(1)+"%")})});
document.documentElement.addEventListener("mouseleave",function(){rz(cur);cur=null})}
/* 3D reveal on scroll */
var io=("IntersectionObserver" in window)?new IntersectionObserver(function(es){var n=0;es.forEach(function(en){if(!en.isIntersecting)return;var el=en.target;io.unobserve(el);el.style.setProperty("--d",Math.min(n++,8)*.06+"s");el.classList.add("in");setTimeout(function(){el.classList.remove("rv","in");el.style.removeProperty("--d")},1300)})},{threshold:.08}):null;
var L=document.getElementById("list");
if(L&&io)new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(el){if(el.classList&&el.classList.contains("item")){el.classList.add("rv");io.observe(el)}})})}).observe(L,{childList:true});
})();
</script>
